name: Build APKs

# Compiles the APK of each project on GitHub's servers.
# The ubuntu runner already has the Android SDK, so only Gradle has to be pinned
# to a version that Android Gradle Plugin 8.5.2 supports.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Q1_KotlinBasics
          - Q2_Layouts
          - Q3_MiniCalculator
          - Q4_ExplicitIntent
          - Q5_ActivityLifecycle

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-apk
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
